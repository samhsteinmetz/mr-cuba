<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Motorbike silhouette -->
  <g fill="#1a1a1a" stroke="none">
    <!-- Back wheel -->
    <circle cx="30" cy="65" r="12" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="30" cy="65" r="6" fill="#1a1a1a"/>
    
    <!-- Front wheel -->
    <circle cx="70" cy="65" r="12" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="70" cy="65" r="6" fill="#1a1a1a"/>
    
    <!-- Frame -->
    <path d="M 30 65 L 45 45 L 60 45 L 70 65" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Seat -->
    <path d="M 42 45 Q 48 42 54 45" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Handlebar -->
    <path d="M 58 45 L 65 38" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="62" y1="36" x2="68" y2="36" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mountain silhouette in background -->
    <path d="M 20 35 L 30 20 L 40 28 L 50 15 L 60 25 L 70 18 L 80 30 L 80 40 L 20 40 Z" fill="#1a1a1a" opacity="0.2"/>
  </g>
</svg>

